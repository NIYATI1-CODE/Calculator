<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js" ></script>
  </head>
  <body>
    <div class="Calculator">
      <div class="Display">6789</div>
      <div>
        <div class="Numbers">
          <button>0</button>
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>7</button>
          <button>8</button>
          <button>9</button>
        </div>
      <div class="Operators">
          <button>+</button>
          <button>-</button>
          <button>*</button>
          <button>/</button>
          <button>=</button>
          <button>Clear</button>
      </div>
      </div>
      
    </div>
  </body>
</html>
